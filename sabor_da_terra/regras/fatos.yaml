    observacao: Ovos só dispensam o SIE na venda direta ao consumidor final.
    fonte: certificacoes/inspecao_adagro_2026.txt

# Não conformidades da inspeção da ADAGRO que limitam a venda de um produto.
nao_conformidades:
  - codigo: NC-001
    relatorio: ADAGRO-AM-2026-0189
    produtor_id: P017
    produtos: [frango caipira]
    descricao: produtor de frango caipira sem registro no SIE
    acao: a cooperativa deve suspender a intermediação até o produtor obter o registro
    permitido: venda direta ao consumidor final
    fonte: certificacoes/inspecao_adagro_2026.txt

