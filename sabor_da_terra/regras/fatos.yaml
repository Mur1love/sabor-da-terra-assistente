      solicitada_em: 2026-09-15
      auditoria_em: 2026-11-15
      # Preencher quando a certificadora emitir o novo certificado.
      concluida_em: null
      nova_validade: null
    fonte: certificacoes/cert_organica_josefa_souza_P008.txt

  - produtor_id: P009
