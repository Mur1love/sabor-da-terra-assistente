# Fatos de conformidade tirados dos documentos de data/.
#
# Todo fato tem "fonte": o arquivo de data/ de onde ele saiu. Os alertas das
# regras citam essa fonte. Em produção esta base vira uma tabela no BigQuery.
#
# Datas no formato AAAA-MM-DD. Nomes de produto iguais aos do catálogo
# (sazonalidade e tabela de preços).

certificacoes_organicas:
  - produtor_id: P001
    certificado: ORG-PE-2025-004721
    certificadora: IBD Certificações
    emissao: 2025-06-15
    validade: 2027-06-15
    produtos: [goiaba paluma, acerola, manga tommy]
    fonte: certificacoes/cert_organica_maria_silva_P001.txt

  - produtor_id: P002
    certificado: ORG-PE-2025-003198
