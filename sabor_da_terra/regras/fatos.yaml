# Produtos de origem animal: o PNAE exige SIE, SIM ou SISBI para eles.
origem_animal:
  produtos:
    - queijo coalho
    - queijo manteiga
    - ricota
    - manteiga de garrafa
    - nata
    - iogurte natural
    - leite
    - mel silvestre
    - mel de jandaíra
    - própolis
    - pólen
    - cera de abelha
    - frango caipira
    - ovos caipira
  fonte: contratos/contrato_pnae_garanhuns.txt

# Contratos com compradores. O comprador é reconhecido quando um dos "nomes"
# aparece no texto ("Prefeitura de Garanhuns - PNAE") ou quando o texto é
# exatamente um dos "apelidos" ("Raízes"). Apelido curto não vale como parte
# de outro nome: "Raízes Distribuidora" não é o Restaurante Raízes.
# preco: "contrato" usa os itens abaixo; "tabela" usa a tabela geral.
contratos:
  - id: pnae
    numero: 045/2026-PNAE
    comprador: Prefeitura de Garanhuns (PNAE)
    nomes: [pnae, prefeitura de garanhuns, merenda escolar, alimentacao escolar, secretaria municipal de educacao]
    inicio: 2026-03-01
    fim: 2027-02-28
    preco: contrato
    exige_sie_origem_animal: true
    exige_dap_caf: true
    condicoes:
      - produto orgânico só com certificação válida
      - nota fiscal individual por produtor
      - entrega semanal conforme o cardápio da nutricionista
      - pagamento por empenho em até 45 dias após o atesto
    itens:
      - {produto: banana prata, preco: 3.80, unidade: kg}
      - {produto: goiaba paluma, preco: 5.20, unidade: kg}
      - {produto: manga tommy, preco: 5.50, unidade: kg, observacao: só na safra}
      - {produto: maracujá, preco: 6.00, unidade: kg}
      - {produto: macaxeira, preco: 3.50, unidade: kg}
      - {produto: inhame, preco: 5.00, unidade: kg}
      - {produto: batata doce, preco: 4.00, unidade: kg}
      - {produto: alface, preco: 2.80, unidade: unidade}
      - {produto: coentro, preco: 2.00, unidade: maço}
      - {produto: tomate, preco: 7.00, unidade: kg}
      - {produto: queijo coalho, preco: 34.00, unidade: kg}
      - {produto: mel silvestre, preco: 58.00, unidade: kg, exige_organico: true}
      - {produto: ovos caipira, preco: 18.00, unidade: dúzia}
      - {produto: frango caipira, preco: 29.00, unidade: kg}
    fonte: contratos/contrato_pnae_garanhuns.txt

  - id: bom_preco
    numero: 012/2026
    comprador: Mercado Bom Preço
    nomes: [mercado bom preco]
    apelidos: [bom preco]
    inicio: 2026-01-01
    fim: 2026-12-31
    preco: tabela
    dias_entrega: [terca, sexta]
    condicoes:
      - entrega das 6h às 10h no CD do Mercado Bom Preço (Rod. BR-423 km 3)
      - pagamento por boleto com vencimento em 30 dias
      - multa de 2% ao dia por atraso na entrega
      - produto fora do padrão é devolvido sem custo para o comprador
    fonte: contratos/contrato_mercado_bom_preco.txt

  - id: raizes
    numero: 008/2026
    comprador: Restaurante Raízes
    nomes: [restaurante raizes]
    apelidos: [raizes]
    inicio: 2026-01-10
    preco: tabela
    condicoes:
      - pagamento por PIX no ato da entrega
      - entrega no restaurante até as 10h
      - prioridade para produtos orgânicos e de produtores locais
    fonte: contratos/contrato_restaurante_raizes.txt
