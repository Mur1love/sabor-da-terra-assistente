    emissao: 2025-03-20
    validade: 2027-03-20
    produtos: [mel silvestre, mel de jandaíra, própolis]
    fonte: certificacoes/cert_organica_jose_santos_P002.txt

  - produtor_id: P004
    certificado: ECO-BR-2024-PE-0891
