- id: ANTI-003
  desafio: "Triagem de pedidos"
  requisito: "Identificar produtor inativo e não alocar fornecimento"

  entrada: >
    Podemos acionar o produtor P015 (Geraldo
    Manoel Barbosa) para fornecer 150kg de
    macaxeira e 100kg de feijão esta semana?

  esperado: >
    Informar que o produtor P015 (Geraldo Manoel
    Barbosa) está com status "inativo" no cadastro
    da cooperativa, não devendo ser acionado para
    fornecimento. Sugerir como alternativa para
    macaxeira o produtor ativo P005 (Francisco de
    Assis Cordeiro, capacidade ~400kg/semana) e
    informar que feijão não possui produtor ativo
    com capacidade documentada nas fichas técnicas.

  funcoes_esperadas: []

  deve_conter:
    - "Identificação do produtor P015"
    - "Status inativo no cadastro"
    - "Impossibilidade de alocação direta para P015"
    - "Alternativa P005 para macaxeira"
    - "Citação de data/produtores.csv"

  nao_deve_conter:
    - "P015 tratado como produtor ativo"
    - "Fornecimento de feijão confirmado sem base"

  fonte:
    - "data/produtores.csv"
    - "data/fichas_tecnicas/tuberculos_graos.txt"
    - "docs/02-dataset.md"
