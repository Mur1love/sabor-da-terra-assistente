    - "Contrato 045/2026-PNAE"
    - "200kg de banana prata"
    - "100kg de goiaba"
    - "150kg de macaxeira"
    - "80kg de inhame"
    - "200 unidades de alface"
    - "100 maços de coentro"
    - "50kg de tomate"
    - "20kg de mel silvestre orgânico"
    - "100 dúzias de ovos caipiras"
    - "Entrega de 04 a 08/11/2026"
    - "Horário de 7h às 12h"
    - "Consulta aos preços contratuais"
    - "Verificação de certificação orgânica"
    - "Verificação de exigências sanitárias"
    - "Verificação de notas fiscais e DAP/CAF"

  nao_deve_conter:
    - "Preços gerais usados no lugar dos contratuais"
    - "Certificação vencida aceita como válida"
    - "Venda institucional sem documentação exigida"
