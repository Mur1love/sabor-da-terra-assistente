- id: TRI-007
  pedido_id: PED-2026-007
  desafio: "Triagem de pedidos"
  requisito: "Verificar disponibilidade, sazonalidade e restrições"

  data_recebimento: "29/10/2026 09:30:00"

  entrada: >
    Pedido para evento de 08/nov,
    jantar regional com 120 convidados.

    Queijo coalho 25kg,
    queijo manteiga 10kg,
    mel variado 8kg, preferencialmente orgânico,
    goiaba 20kg,
    cajá 10kg, se tiver,
    rapadura 15kg,
    tapioca/goma 10kg,
    frango caipira 40kg
    e ovos caipiras 30 dúzias.

    Precisamos saber a disponibilidade
    dos produtos e o valor total.

  esperado: >
    Classificar como pedido para evento
    com solicitação de cotação.

    Identificar os nove produtos,
    suas quantidades e unidades de medida.

    Registrar o evento para 08/11/2026,
    com 120 convidados.

    Consultar a disponibilidade dos
    produtos e a capacidade dos produtores.

    Verificar a sazonalidade do cajá,
    que apresenta baixa disponibilidade
    em novembro. Tratar o item como
    opcional e não garantir seu fornecimento.

    Reconhecer que o mel orgânico
    é uma preferência do comprador.
    Caso seja ofertado como orgânico,
    verificar a certificação do fornecedor.

    Não considerar válida a certificação
    orgânica vencida do produtor P008.

    Identificar a restrição sanitária
    do produtor P017, que impede a
    intermediação de frango caipira
    pela cooperativa.

    Verificar separadamente as condições
    aplicáveis ao fornecimento de ovos.

    Consultar a tabela de preços
    e calcular o orçamento apenas
    com valores e quantidades verificados.

    Caso algum produto não possa ser
    fornecido, informar a limitação
    e solicitar confirmação de alternativas.

    Não inventar preços, disponibilidade
    ou autorizações sanitárias.

  funcoes_esperadas: [ triar_pedido, verificar_conformidade, disponibilidade, preco ]

  deve_conter:
