    oficial de fiscalizacao sanitaria,
    e nao como pedido de compra.

    Identificar a ADAGRO como o orgao
    responsavel pela notificacao.

    Registrar as datas da inspecao:
    11 e 12 de novembro de 2026.

    Identificar todos os documentos
    solicitados pelo orgao fiscalizador.

    Consultar o cadastro dos produtores
    e verificar as informacoes cadastrais
    exigidas pela notificacao.

    Consultar os certificados organicos
    e identificar quais estao vigentes
    na data de referencia.

    Sinalizar que a certificacao da
