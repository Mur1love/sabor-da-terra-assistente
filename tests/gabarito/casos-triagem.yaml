    - "10kg de cajá opcional"
    - "15kg de rapadura"
    - "10kg de tapioca/goma"
    - "40kg de frango caipira"
    - "30 dúzias de ovos caipiras"
    - "Verificação de sazonalidade do cajá"
    - "Preferência por mel orgânico"
    - "Verificação de certificação orgânica"
