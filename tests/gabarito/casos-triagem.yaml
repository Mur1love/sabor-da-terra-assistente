- id: TRI-009
  pedido_id: PED-2026-009
  desafio: "Triagem de pedidos"
  requisito: "Identificar exigências documentais e rastreabilidade"

  data_recebimento: "29/10/2026 11:45:00"

  entrada: >
    Solicitamos cotação e disponibilidade
    para fornecimento semanal:

    Frutas variadas: goiaba, banana,
    manga e maracujá, 100kg no total.

    Hortaliças: alface, couve, espinafre,
    tomate e cebolinha, 60kg no total.

    Ovos caipiras: 50 dúzias.
    Mel puro: 5kg.

    É obrigatório apresentar certificação
    orgânica para todos os itens possíveis,
    laudo sanitário atualizado e
    rastreabilidade completa.

    Solicitamos cópias das certificações,
    fichas técnicas e dados cadastrais
    dos produtores, incluindo registro CAF.

  esperado: >
    Classificar como solicitação de cotação
    para fornecimento semanal, sem registrar
    automaticamente uma compra confirmada.

    Identificar 100kg totais de frutas,
    distribuídos entre goiaba, banana,
    manga e maracujá, sem inventar
    quantidades individuais.

    Identificar 60kg totais de hortaliças,
    incluindo alface, couve, espinafre,
    tomate e cebolinha, sem atribuir
    quantidades individuais inexistentes.

    Identificar 50 dúzias de ovos caipiras
    e 5kg de mel puro.

    Verificar disponibilidade dos produtos
    e capacidade de fornecimento semanal.

    Consultar certificações orgânicas e
    verificar quais produtos possuem
    comprovação válida.

    Respeitar a exigência de certificação
    para todos os itens em que ela
    for aplicável.

    Consultar laudos sanitários atualizados
    e informar eventuais documentos
    ausentes ou vencidos.

    Consultar registros de rastreabilidade
    para identificar produtor, lote e
    data de colheita quando aplicável
    ao tipo de produto.

    Consultar fichas técnicas e informações
    cadastrais dos produtores fornecedores.

    Verificar a existência e a validade
    dos registros CAF, sem presumir que
    todos os produtores estejam regulares.

    Tratar dados pessoais dos produtores
    conforme as regras de confidencialidade,
    evitando exposição desnecessária.

    Solicitar esclarecimento sobre a
    distribuição das quantidades entre
    frutas e hortaliças, caso necessário
    para elaborar a cotação.

    Não inventar certificações, laudos,
    registros CAF, preços ou disponibilidade.

  funcoes_esperadas: [ consultar_documentos, verificar_conformidade, consultar_lotes ]

  deve_conter:
    - "Classificação como solicitação de cotação"
    - "Fornecimento semanal"
    - "100kg totais de frutas variadas"
    - "Goiaba, banana, manga e maracujá"
    - "60kg totais de hortaliças"
    - "Alface, couve, espinafre, tomate e cebolinha"
    - "50 dúzias de ovos caipiras"
    - "5kg de mel puro"
    - "Verificação de certificação orgânica"
    - "Consulta aos laudos sanitários"
    - "Verificação de rastreabilidade"
    - "Identificação de produtor e lote"
    - "Consulta às fichas técnicas"
    - "Verificação dos registros CAF"
    - "Verificação de disponibilidade semanal"
    - "Identificação de documentos ausentes"

  nao_deve_conter:
    - "Compra registrada automaticamente"
    - "100kg atribuídos a cada fruta"
    - "60kg atribuídos a cada hortaliça"
    - "Certificações inexistentes ou vencidas aceitas"
    - "Laudos sanitários inventados"
    - "Registros CAF presumidos como válidos"
    - "Rastreabilidade inventada"
