  entrada: >
    Dona Lúcia, tô ligando pra saber
    quanto eu vendi esse mês.

    E aquele pagamento do Mercado Bom Preço
    de setembro, já caiu?

    Me diz quanto tá o saldo que eu
    tenho pra receber. Bjs.

