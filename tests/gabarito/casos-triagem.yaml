- id: TRI-004
  pedido_id: PED-2026-004
  desafio: "Triagem de pedidos"
  requisito: "Interpretar pedidos e validar exigências contratuais"

  data_recebimento: "28/10/2026 14:20:00"

  entrada: >
    Conforme o Contrato 045/2026-PNAE,
    solicitamos para o período de 04 a
    08 de novembro de 2026:

    Banana prata 200kg, goiaba 100kg,
    macaxeira 150kg, inhame 80kg,
    alface 200 unidades, coentro 100 maços,
    tomate 50kg, mel silvestre orgânico
    20kg e ovos caipiras 100 dúzias.

    Todos os produtos devem ter notas
    fiscais e certificações aplicáveis.
    Entrega no depósito central,
    das 7h às 12h.

  esperado: >
    Classificar como pedido institucional
    de compra vinculado ao PNAE.

    Identificar corretamente os nove
    produtos, quantidades e unidades.

    Registrar o período de entrega de
    04 a 08/11/2026 e o horário
    de 7h às 12h no depósito central.

    Consultar o Contrato 045/2026-PNAE
    e utilizar os preços contratados,
    não os preços da tabela geral.

    Verificar a disponibilidade dos
    produtos e a capacidade de atendimento.

    Para o mel silvestre orgânico,
    verificar a validade da certificação
    do fornecedor, sem aceitar
    certificações vencidas.

    Para os ovos caipiras, conferir
    as exigências sanitárias aplicáveis
    ao fornecimento institucional.

    Verificar DAP/CAF dos produtores
    e as notas fiscais exigidas
    pelo contrato.

    Não confirmar o atendimento
    antes de verificar as condições.

  funcoes_esperadas: [ triar_pedido, verificar_conformidade ]

  deve_conter:
