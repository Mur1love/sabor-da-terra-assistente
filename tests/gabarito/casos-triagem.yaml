  entrada: >
    PEDIDO URGENTE!

    Necessitamos com máxima urgência
    para HOJE (29/10):

    Queijo coalho: 200kg
    Queijo manteiga: 50kg
    Mel silvestre orgânico: 40kg
    Goiaba: 300kg

    Pagamento por boleto em 30 dias,
    conforme contrato.

    Entrega no CD SuperBom,
    BR-423 km 12, Garanhuns.

    Se não atenderem hoje,
    perderemos a promoção de fim de semana.

