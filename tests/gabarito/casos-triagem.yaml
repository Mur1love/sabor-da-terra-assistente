    a ausencia ou insuficiencia.

    Consultar os contratos existentes
    com compradores institucionais.

    Organizar uma lista dos documentos
    encontrados e das pendencias
    que precisam ser resolvidas.

    Identificar a possibilidade de
    suspensao do SIE caso as exigencias
    nao sejam atendidas.

    Nao afirmar que o SIE ja esta
    suspenso apenas pela notificacao.

    Proteger os dados pessoais dos
