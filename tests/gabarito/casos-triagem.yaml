
- id: TRI-001
  pedido_id: PED-2026-001
  desafio: "Triagem de pedidos"
  requisito: "Interpretar pedidos em linguagem natural"

  entrada: >
    Bom dia! Preciso pra essa sexta (01/nov):
    30kg de queijo coalho, 10kg de manteiga
    de garrafa, 5kg de mel silvestre,
    20 maços de coentro e 10 de cebolinha.
    Se tiver ricota fresca também quero
    uns 5kg. Obrigado! Carlos.

  esperado: >
    Classificar a mensagem como pedido de compra.
    Identificar os produtos e suas quantidades:
    30kg de queijo coalho, 10kg de manteiga
    de garrafa, 5kg de mel silvestre,
    20 maços de coentro e 10 maços de
    cebolinha. Registrar aproximadamente
    5kg de ricota fresca como item opcional,
    sujeito a disponibilidade.
    Solicitar confirmação da data de entrega,
    pois 01/11/2026 corresponde a domingo,
    não sexta-feira.
    Não confirmar disponibilidade sem consulta.

  funcoes_esperadas: [ triar_pedido, verificar_conformidade ]

  deve_conter:
    - "Classificação como pedido de compra"
    - "30kg de queijo coalho"
    - "10kg de manteiga de garrafa"
    - "5kg de mel silvestre"
    - "20 maços de coentro"
    - "10 maços de cebolinha"
    - "Ricota fresca opcional"
    - "Confirmação da data de entrega"

  nao_deve_conter:
    - "Ricota confirmada sem verificar disponibilidade"
    - "Data contraditória aceita sem ressalva"
    - "Substituição dos tipos de produtos solicitados"

  fonte:
    - "data/pedidos.json (PED-2026-001)"
    - "docs/02-dataset.md"




