    periodo dos ultimos 12 meses
    aplicavel a inspecao.

    Consultar os registros de
    rastreabilidade dos produtos.

    Verificar se existem registros
    dos ultimos tres lotes de cada
    produto solicitado.

    Caso algum produto nao possua
