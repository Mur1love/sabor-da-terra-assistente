    A Cooperativa Sabor da Terra sera
    submetida a inspecao sanitaria da
    ADAGRO nos dias 11 e 12 de novembro
    de 2026.

    Devem estar disponiveis:

    - Cadastro atualizado de todos os
      produtores, incluindo nome, CPF,
      endereco e produtos.
    - Certificacoes organicas vigentes.
    - Laudos sanitarios dos ultimos 12 meses.
    - Registros de rastreabilidade dos
      ultimos 3 lotes de cada produto.
